<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبارات مكتب المحاماة</title><style>body{font-family:Arial;padding:24px}li{margin:8px}.pass{color:green}.fail{color:#b42318}</style></head><body><div id="modal-root"></div><h1>اختبارات الأساس</h1><div id="out">جارٍ التشغيل…</div><script type="module">import {test,expect,run} from './js/tests/runner.js';import {normalizeArabic,normalizeDigits} from './js/core/search-normalizer.js';import {validateClient} from './js/domain/validators.js';import {runTransactionTests} from './js/tests/transaction-tests.js';import {runClientFileTests} from './js/tests/client-file-tests.js';import {runServiceAndRelationsTests} from './js/tests/service-and-relations-tests.js';import {runBackupAndIntegrityTests} from './js/tests/backup-and-integrity-tests.js';
import {runUxTests} from './js/tests/ux-tests.js';
import {runSearchTableTests,runGridUpgradeTests} from './js/tests/search-table-tests.js';import {runFileNumberTests} from './js/tests/file-number-tests.js';import {runCardSidebarTests} from './js/tests/card-sidebar-tests.js';import {runTopNavTests} from './js/tests/topnav-tests.js';import {runDemoSeedTests} from './js/tests/demo-seed-tests.js';import {runCollapseStateTests} from './js/tests/collapse-state-tests.js';import {runGridProviderTests} from './js/tests/grid-provider-tests.js';import {runDisplayPrefsTests} from './js/tests/display-prefs-tests.js';import {runComponentStyleTests} from './js/tests/component-style-tests.js';import {runGridContextTests} from './js/tests/grid-context-tests.js';import {formatDate,formatDateTime,parseDisplayDate} from './js/core/format.js';import {contrast,PRESETS,normalize} from './js/ui/theme.js';test('Date format DD/MM/YYYY',()=>expect(formatDate('2026-09-28')).toBe('28/09/2026'));test('Date parse from DD/MM/YYYY',()=>expect(parseDisplayDate('5/9/2026')).toBe('2026-09-05'));test('Invalid date rejected',()=>expect(parseDisplayDate('31/02/2026')).toBe(''));test('Arabic digit date',()=>expect(parseDisplayDate('٢٨/٠٩/٢٠٢٦')).toBe('2026-09-28'));test('DateTime format',()=>expect(formatDateTime(new Date(2026,8,28,9,5))).toBe('28/09/2026 09:05'));test('Themes meet WCAG AA text contrast',()=>{for(const p of Object.values(PRESETS)){if(contrast(p.c.text,p.c.surface)<4.5||contrast(p.c.textMuted,p.c.surface)<4.5)throw Error(p.name)}});test('Theme config normalizes unknown preset',()=>expect(normalize({preset:'x'}).preset).toBe('luxuryGold'));test('Arabic normalization',()=>expect(normalizeArabic('أحمد ـ إكرام')).toBe('احمد اكرام'));test('Arabic digits',()=>expect(normalizeDigits('١٢٣')).toBe('123'));test('national id validation',()=>expect(Object.keys(validateClient({fullName:'أحمد',nationalId:'123'})).length).toBe(1));test('valid client',()=>expect(Object.keys(validateClient({fullName:'أحمد',nationalId:'12345678901234'})).length).toBe(0));const {pagingState,nextPage,prevPage,applyPageResult,currentCursor}=await import('./js/ui/pagination.js');const {localDate,addDays,isActiveProcedure}=await import('./js/core/clock.js');test('cursor stack paging',()=>{const s=pagingState();applyPageResult(s,{nextCursor:'c2',hasMore:true});expect(nextPage(s)).toBe(true);expect(currentCursor(s)).toBe('c2');applyPageResult(s,{nextCursor:null,hasMore:false});expect(nextPage(s)).toBe(false);expect(prevPage(s)).toBe(true);expect(currentCursor(s)).toBe(null);expect(prevPage(s)).toBe(false)});test('local date helpers',()=>{expect(localDate(new Date(2026,0,31))).toBe('2026-01-31');expect(addDays('2026-02-28',1)).toBe('2026-03-01')});test('open procedures are active',()=>{expect(isActiveProcedure({status:'open'})).toBe(true);expect(isActiveProcedure({status:'pending'})).toBe(true);expect(isActiveProcedure({status:'done'})).toBe(false)});await runTransactionTests(test,expect);await runClientFileTests(test,expect);await runServiceAndRelationsTests(test,expect);await runBackupAndIntegrityTests(test,expect);await runUxTests(test,expect);await runFileNumberTests(test,expect);await runCardSidebarTests(test,expect);await runTopNavTests(test,expect);await runSearchTableTests(test,expect);await runGridUpgradeTests(test,expect);await runDemoSeedTests(test,expect);await runCollapseStateTests(test,expect);await runGridProviderTests(test,expect);runDisplayPrefsTests(test,expect);runComponentStyleTests(test,expect);runGridContextTests(test,expect);const r=await run();let output=document.querySelector('#out');if(!output){output=document.createElement('div');output.id='out';document.body.append(output)}output.innerHTML=`<p>${r.passed}/${r.total} ناجحة</p><ol>${r.results.map(x=>`<li class="${x[0]==='PASS'?'pass':'fail'}">${x[0]} — ${x[1]} ${x[2]||''}</li>`).join('')}</ol>`</script></body></html>
