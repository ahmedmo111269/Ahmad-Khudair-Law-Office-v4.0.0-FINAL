<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبارات مكتب المحاماة</title><style>body{font-family:Arial;padding:24px}li{margin:8px}.pass{color:green}.fail{color:#b42318}</style></head><body><h1>اختبارات الأساس</h1><div id="out">جارٍ التشغيل…</div><script type="module">import {test,expect,run} from './js/tests/runner.js';import {normalizeArabic,normalizeDigits} from './js/core/search-normalizer.js';import {validateClient} from './js/domain/validators.js';import {runTransactionTests} from './js/tests/transaction-tests.js';test('Arabic normalization',()=>expect(normalizeArabic('أحمد ـ إكرام')).toBe('احمد اكرام'));test('Arabic digits',()=>expect(normalizeDigits('١٢٣')).toBe('123'));test('national id validation',()=>expect(Object.keys(validateClient({fullName:'أحمد',nationalId:'123'})).length).toBe(1));test('valid client',()=>expect(Object.keys(validateClient({fullName:'أحمد',nationalId:'12345678901234'})).length).toBe(0));const {pagingState,nextPage,prevPage,applyPageResult,currentCursor}=await import('./js/ui/pagination.js');const {localDate,addDays,isActiveProcedure}=await import('./js/core/clock.js');test('cursor stack paging',()=>{const s=pagingState();applyPageResult(s,{nextCursor:'c2',hasMore:true});expect(nextPage(s)).toBe(true);expect(currentCursor(s)).toBe('c2');applyPageResult(s,{nextCursor:null,hasMore:false});expect(nextPage(s)).toBe(false);expect(prevPage(s)).toBe(true);expect(currentCursor(s)).toBe(null);expect(prevPage(s)).toBe(false)});test('local date helpers',()=>{expect(localDate(new Date(2026,0,31))).toBe('2026-01-31');expect(addDays('2026-02-28',1)).toBe('2026-03-01')});test('open procedures are active',()=>{expect(isActiveProcedure({status:'open'})).toBe(true);expect(isActiveProcedure({status:'pending'})).toBe(true);expect(isActiveProcedure({status:'done'})).toBe(false)});await runTransactionTests(test,expect);const r=await run();document.querySelector('#out').innerHTML=`<p>${r.passed}/${r.total} ناجحة</p><ol>${r.results.map(x=>`<li class="${x[0]==='PASS'?'pass':'fail'}">${x[0]} — ${x[1]} ${x[2]||''}</li>`).join('')}</ol>`</script></body></html>
