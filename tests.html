<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبارات مكتب المحاماة</title><style>body{font-family:Arial;padding:24px}li{margin:8px}.pass{color:green}.fail{color:#b42318}</style></head><body><h1>اختبارات الأساس</h1><div id="out">جارٍ التشغيل…</div><script type="module">import {test,expect,run} from './js/tests/runner.js';import {normalizeArabic,normalizeDigits} from './js/core/search-normalizer.js';import {validateClient} from './js/domain/validators.js';import {runTransactionTests} from './js/tests/transaction-tests.js';test('Arabic normalization',()=>expect(normalizeArabic('أحمد ـ إكرام')).toBe('احمد اكرام'));test('Arabic digits',()=>expect(normalizeDigits('١٢٣')).toBe('123'));test('national id validation',()=>expect(Object.keys(validateClient({fullName:'أحمد',nationalId:'123'})).length).toBe(1));test('valid client',()=>expect(Object.keys(validateClient({fullName:'أحمد',nationalId:'12345678901234'})).length).toBe(0));await runTransactionTests(test,expect);const r=await run();document.querySelector('#out').innerHTML=`<p>${r.passed}/${r.total} ناجحة</p><ol>${r.results.map(x=>`<li class="${x[0]==='PASS'?'pass':'fail'}">${x[0]} — ${x[1]} ${x[2]||''}</li>`).join('')}</ol>`</script></body></html>
